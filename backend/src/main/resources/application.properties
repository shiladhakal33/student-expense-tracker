# ==== Server ====
server.port=8080

# ==== Database (H2, file-based -> data survives restarts, zero setup) ====
spring.datasource.url=jdbc:h2:file:./data/smartspend;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Optional: browse the DB at http://localhost:8080/h2-console
# JDBC URL to paste in there: jdbc:h2:file:./data/smartspend
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==== JWT ====
# CHANGE THIS before deploying anywhere real. Override via env var JWT_SECRET
# so the real secret never lives in source control. Must decode to >= 32 bytes
# for HS256. This default is a random dev-only value.
app.jwt.secret=${JWT_SECRET:c3RhcnRlci1kZXYtc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtcHJvZC1kZXBsb3ktMTIzNDU2Nzg=}
app.jwt.expiration-ms=86400000

# ==== CORS ====
# Add the origin(s) your frontend is actually served from. If you open
# index.html via file://, the browser sends "null" as the Origin header.
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,null
