# Activated on Render by setting the env var SPRING_PROFILES_ACTIVE=prod.
# Every value below comes from an environment variable you set in Render's
# dashboard — nothing sensitive is ever committed to Git.

# Render assigns the port your app must listen on via $PORT.
server.port=${PORT:8080}

# ==== Database (Neon Postgres — free, permanent) ====
# DATABASE_URL example: jdbc:postgresql://ep-xxxx.neon.tech/smartspend?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# ==== JWT ====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ==== CORS ====
# The exact URL your frontend is hosted at, e.g.
# https://yourname.github.io
app.cors.allowed-origins=${CORS_ORIGINS}
